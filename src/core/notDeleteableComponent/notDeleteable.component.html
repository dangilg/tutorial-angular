<div class="container">
    <h1>ATENCIÓN</h1>
    <div [innerHTML]="text" class="description"></div>
    <div class="lista">
      <ul>
        @for(obj of list; track obj.id){

            {{obj.name}}
          </li>
        }
      </ul> </div>

    </div>
</div>
