<div class="page">

  <div class="page-header">
    <h1>Listado de Clientes</h1>
  </div>

  <div class="page-container">
    <div class="table-wrapper">

      <div class="table-scroll">
        <mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef> Identificador </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="name">
            <mat-header-cell *matHeaderCellDef> Nombre cliente </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="action">
            <mat-header-cell *matHeaderCellDef></mat-header-cell>

            <mat-cell *matCellDef="let element">
              @if(isLoggedIn$|async){
              <button (click)="edit(element)" mat-icon-button color="primary"><mat-icon>edit</mat-icon></button>
              <button (click)="delete(element)" mat-icon-button color="accent"><mat-icon>clear</mat-icon></button>
              }
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </div>
  </div>

  @if(isLoggedIn$|async ){
  <div class="page-footer">
    <button mat-flat-button color="primary" (click)="createClient()">Nuevo Cliente</button>
  </div>
  }
</div>
